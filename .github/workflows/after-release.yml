name: after-release

on:
  release:
    types: [ published ]

jobs:
  after-release:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false

    steps:
      - name: Use GitHub App
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app
        with:
          client-id: ${{ vars.AYAKA_RELEASES_APP_ID }}
          private-key: ${{ secrets.AYAKA_RELEASES_PRIVATE_KEY }}

      - name: Calculate Git User
        id: git-config
        run: |
          # Read the user info for the app, e.g. /users/renovate[bot]
          userId=$(gh api "/users/${{ steps.app.outputs.app-slug }}[bot]" --jq .id)

          echo "email=$userId+${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          echo "name=${{ steps.app.outputs.app-slug }}[bot]" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      # The release event checks out the tag, the changes go on top of main
      - name: Create After-Release Branch
        run: |
          if git rev-parse --verify --quiet refs/remotes/origin/after-release > /dev/null; then
            echo "::error::Branch 'after-release' already exists. Merge or close its pull request, delete the branch and rerun"
            exit 1
          fi

          git checkout --quiet --no-track -b after-release origin/main

      - name: Ship Public APIs
        run: |
          ./eng/scripts/ship-public-apis.sh

      - name: Publish After-Release Changes
        run: |
          git add 'src/*/PublicAPI.*.txt'

          if git diff --cached --quiet; then
            echo "::warning::No after-release changes detected. Skipping commit, push and pull request"
            exit 0
          fi

          git config user.email "$GIT_CONFIG_EMAIL"
          git config user.name "$GIT_CONFIG_NAME"
          git commit --quiet -m "chore: ship public apis"
          git push --quiet -u origin after-release

          gh pr create --base main --head after-release --title "chore: after release changes" --body-file - <<'EOF'
          **This PR was automatically generated after the release**

          - Ships the public APIs for the latest release.
          EOF
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GIT_CONFIG_EMAIL: ${{ steps.git-config.outputs.email }}
          GIT_CONFIG_NAME: ${{ steps.git-config.outputs.name }}
